<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Aniversários</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎂 Aniversários da turma de Dev</h1>
        
        <!-- Formulário de Cadastro -->
        <div class="form-section">
            <h2>Cadastrar Aniversariante</h2>
            <form id="birthdayForm">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" required placeholder="Digite o nome completo">
                </div>
                <div class="form-group">
                    <label for="dataNascimento">Data de Nascimento:</label>
                    <input type="date" id="dataNascimento" required>
                </div>
                <button type="submit" class="btn-primary">Cadastrar</button>
            </form>
        </div>

        <!-- Notificação -->
        <div id="notification" class="notification hidden"></div>

        <!-- Estatísticas -->
        <div class="stats">
            <div class="stat-card">
                <h3>Total Cadastrados</h3>
                <p id="totalCount">0</p>
            </div>
            <div class="stat-card">
                <h3>Aniversários Hoje</h3>
                <p id="todayCount">0</p>
            </div>
        </div>

        <!-- Tabela de Aniversários -->
        <div class="tables-container">
            <!-- Aniversários Futuros -->
            <div class="table-section">
                <h2>📅 Próximos Aniversários</h2>
                <div class="table-responsive">
                    <table id="futureTable">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Data</th>
                                <th>Dias Restantes</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="futureBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- Aniversários Passados -->
            <div class="table-section">
                <h2>⏪ Aniversários Passados</h2>
                <div class="table-responsive">
                    <table id="pastTable">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Data</th>
                                <th>Passou Há</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="pastBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>desenvolvido por penelope - turma de desenvolvimento de sistemas - 2026</p>
        </footer>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
